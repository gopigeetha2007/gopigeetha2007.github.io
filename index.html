<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Data Logger</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header>
        <h1>IoT Temperature & Humidity Logger</h1>
    </header>

    <div class="container">

        <div class="cards">
            <div class="card">
                <h2>Temperature</h2>
                <p id="temp">0 °C</p>
            </div>

            <div class="card">
                <h2>Humidity</h2>
                <p id="hum">0 %</p>
            </div>
        </div>

        <div class="chart-box">
            <canvas id="myChart"></canvas>
        </div>

        <div class="table-box">
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Temperature</th>
                        <th>Humidity</th>
                    </tr>
                </thead>
                <tbody id="tableData">
                </tbody>
            </table>
        </div>

    </div>

<script src="script.js"></script>
</body>
</html>
